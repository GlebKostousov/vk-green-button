repos:
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.10.5
    hooks:
      - id: uv-lock
      - id: uv-export
        args:
          - --quiet
          - --no-hashes
          - --frozen
          - --no-header
          - --no-annotate
          - --output-file=requirements.txt
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
      - id: check-json
      - id: check-toml
      - id: detect-private-key
      - id: name-tests-test
        args: ["--pytest-test-first"]
        exclude: ^tests/(__init__\.py|helpers\.py|fakes/)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.2
    hooks:
      - id: ruff
        args:
          - --fix
      - id: ruff-format
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.13.8
    hooks:
      - id: commitizen
        stages: [commit-msg]
  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict)
        entry: uv run mypy .
        language: system
        pass_filenames: false
        types: [python]
